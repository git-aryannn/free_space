name: free_space
description: An intelligent storage manager and digital decluttering tool.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Database (SQLite via Drift)
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Routing
  go_router: ^14.6.2

  # Local Storage (settings)
  shared_preferences: ^2.3.4

  # Notifications
  flutter_local_notifications: ^22.3.1

  # Permissions
  permission_handler: ^11.3.1

  # UI
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2

  # Utilities
  intl: ^0.19.0
  collection: ^1.19.1
  flutter_background_service: ^5.1.0
  workmanager: ^0.10.10
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#121212"
  image: "assets/images/app_icon.png"
  android_12:
    image: "assets/images/app_icon.png"
    icon_background_color: "#121212"
    color: "#121212"
